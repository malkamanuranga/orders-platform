apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../..
images:
  - name: ghcr.io/YOUR_USERNAME/orders-platform
    newTag: stable
patches:
  - target:
      kind: ConfigMap
      name: orders-config
    patch: |-
      - op: add
        path: /data/LOG_LEVEL
        value: warn
