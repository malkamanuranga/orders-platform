apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders-api
  namespace: orders
spec:
  replicas: 2
  selector:
    matchLabels:
      app: orders-api
  template:
    metadata:
      labels:
        app: orders-api
    spec:
      containers:
        - name: api
          image: ghcr.io/YOUR_USERNAME/orders-platform:latest
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: orders-config
